<html lang="ar" dir="rtl">
<head>

<title>بصمة نايل كريستال</title>

<style>
:root{--n9:#071B2B;--n8:#0F3350;--cr:#3FD6C6;--ice:#F6FAFB;--line:#E2E9EC;--ink:#0B2233;--muted:#5C7686;--green:#0E7C6E;--red:#B23A21;--amber:#C9A227}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Cairo',Tahoma,sans-serif;background:var(--n9);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:460px;margin:0 auto;padding:18px 16px 28px}
.top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--cr),#0E7C6E);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--n9)}
.top b{font-size:16px}.top small{display:block;color:#8DA0AB;font-size:12px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
input,select{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--ice);text-align:center;letter-spacing:1px}
input:focus,select:focus{outline:none;border-color:var(--cr)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:700;background:var(--n8);color:#fff;margin-top:16px;cursor:pointer}
.btn:disabled{opacity:.45}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;margin-top:10px;width:100%;cursor:pointer}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hello b{font-size:18px}.hello small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.clock{text-align:center;margin:6px 0 2px;font-size:44px;font-weight:800;letter-spacing:1px;direction:ltr}
.date{text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px}
.loc{display:flex;align-items:center;gap:10px;border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:600;background:#F1F4F6;color:var(--muted)}
.loc i{width:11px;height:11px;border-radius:50%;background:var(--faint,#8DA0AB);flex:none}
.loc.ok{background:#E3FBF7;color:var(--green)}.loc.ok i{background:var(--green)}
.loc.bad{background:#FDE7E2;color:var(--red)}.loc.bad i{background:var(--red)}
.loc.warn{background:#FFF3D6;color:#8a6d00}.loc.warn i{background:var(--amber)}
.punch{width:100%;aspect-ratio:2.2;border:0;border-radius:20px;font:inherit;font-size:26px;font-weight:800;color:#fff;margin-top:14px;background:var(--green);box-shadow:0 8px 22px rgba(14,124,110,.3)}
.punch.out{background:var(--n8);box-shadow:0 8px 22px rgba(15,51,80,.3)}
.punch:disabled{background:#B8C4CB;box-shadow:none}
.log{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.log div{background:var(--ice);border-radius:12px;padding:10px 4px}
.log small{display:block;color:var(--muted);font-size:12px}.log b{font-size:17px;direction:ltr;display:block}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 20px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">N</div><div><b>Nile Crystal</b><small>تسجيل الحضور والانصراف</small></div></div>

  <div class="card" id="vLogin">
    <h2 id="lgTitle">تسجيل الدخول</h2>
    <label>كود الموظف</label>
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="مثال: 4025">
    <div id="pickBox" class="hide"><label>اختر اسمك</label><select id="pick"></select></div>
    <div id="pinBox" class="hide">
      <label id="pinLbl">الرقم السري</label>

      <div id="pin2Box" class="hide"><label>أكد الرقم السري</label><input id="pin2" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div>
    </div>
    <div class="err" id="lgErr"></div>
    <button class="btn" id="lgBtn">التالي</button>
    <button class="link hide" id="lgBack">رجوع</button>
  </div>

  <div id="vMain" class="hide">
    <div class="card">
      <div class="hello"><div><b id="mName"></b><small id="mDept"></small></div><button class="link" style="width:auto;margin:0" id="logout">خروج</button></div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="loc" id="loc"><i></i><span id="locTxt">جاري تحديد موقعك…</span></div>
      <button class="punch" id="punch" disabled>…</button>
      <div class="err" id="mErr"></div>
    </div>
    <div class="card"><h2>سجل اليوم</h2>
      <div class="log"><div><small>الحضور</small><b id="tIn">--:--</b></div><div><small>الانصراف</small><b id="tOut">--:--</b></div><div><small>المدة</small><b id="tDur">--</b></div></div>
    </div>
  </div>
</div>
<div class="toast hide" id="toast"></div>

  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }

let me = null, cands = [], pinDoc = null, mode = "code";
const lgErr = m => { $("lgErr").textContent = m || ""; };
function setMode(m){
  mode = m;
  $("pinBox").classList.toggle("hide", m === "code");
  $("pin2Box").classList.toggle("hide", m !== "set");
  $("lgBack").classList.toggle("hide", m === "code");
  $("code").disabled = m !== "code";
  $("pickBox").classList.toggle("hide", !(m !== "code" && cands.length > 1));
  $("lgBtn").textContent = m === "code" ? "التالي" : m === "set" ? "حفظ الرقم السري ودخول" : "دخول";
  $("pinLbl").textContent = m === "set" ? "اختر رقم سري (4 إلى 6 أرقام)" : "الرقم السري";
  $("lgTitle").textContent = m === "set" ? "أول مرة؟ اختر رقمك السري" : "تسجيل الدخول";
}
$("lgBack").onclick = () => { setMode("code"); lgErr(); $("pin").value = $("pin2").value = ""; };
$("lgBtn").onclick = async () => {
  lgErr(); $("lgBtn").disabled = true;
  try{
    if (mode === "code"){
      const c = $("code").value.trim();
      cands = ROSTER.filter(r => r[2] === c);
      if (!c || !cands.length){ lgErr("الكود ده مش موجود. راجع الكود مع الموارد البشرية."); return; }
      $("pick").innerHTML = cands.map((r, i) => `<option value="${i}">${r[1]}</option>`).join("");
      pinDoc = null; me = cands[0];
      if (cands.length === 1){ const s = await db.collection("punch_pins").doc(String(me[0])).get(); pinDoc = s.exists ? s.data() : null; }
      setMode(cands.length === 1 && !pinDoc ? "set" : "login");
    } else {
      me = cands[+$("pick").value || 0];
      const s = await db.collection("punch_pins").doc(String(me[0])).get(); pinDoc = s.exists ? s.data() : null;
      const pin = $("pin").value.trim();
      if (!/^\d{4,6}$/.test(pin)){ lgErr("الرقم السري من 4 إلى 6 أرقام."); return; }
      const h = await sha(me[0] + ":" + pin + ":nc");
      if (!pinDoc){
        if (pin !== $("pin2").value.trim()){ if (mode === "login"){ setMode("set"); lgErr("أول مرة: اكتب الرقم السري وأكده."); } else lgErr("الرقمين مش متطابقين."); return; }
        await db.collection("punch_pins").doc(String(me[0])).set({ h, at: firebase.firestore.FieldValue.serverTimestamp() });
      } else if (pinDoc.h !== h){ lgErr("الرقم السري غلط."); return; }
      localStorage.setItem("nc_me", String(me[0])); startMain();
    }
  }catch(e){ lgErr("مشكلة اتصال بالإنترنت، حاول تاني."); console.error(e); }
  finally{ $("lgBtn").disabled = false; }
};
$("logout").onclick = () => { localStorage.removeItem("nc_me"); location.reload(); };

/* ===== الشاشة الرئيسية ===== */
let pos = null, recs = {}, watchId = null;
function startMain(){
  $("vLogin").classList.add("hide"); $("vMain").classList.remove("hide");
  $("mName").textContent = me[1]; $("mDept").textContent = me[3];
  if (!navigator.geolocation){ setLoc("bad", "جهازك لا يدعم تحديد الموقع."); }
  else watchId = navigator.geolocation.watchPosition(p => { pos = p.coords; render(); }, e => {
    pos = null; setLoc("bad", e.code === 1 ? "اسمح للتطبيق بالوصول للموقع من إعدادات المتصفح." : "مش قادر أحدد موقعك. فعّل الـ GPS.");
    render(); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  loadRecs();
}
async function loadRecs(){
  const t = new Date(), y = new Date(t - 864e5);
  try{
    const [a, b] = await Promise.all([y, t].map(d => db.collection("punches").doc(me[0] + "_" + dkey(d)).get()));
    recs = { [dkey(y)]: a.exists ? a.data() : null, [dkey(t)]: b.exists ? b.data() : null };
  }catch(e){ $("mErr").textContent = "مشكلة اتصال بالإنترنت."; }
  render();
}
function setLoc(cls, txt){ $("loc").className = "loc " + cls; $("locTxt").textContent = txt; }
function current(){
  const t = new Date(), td = recs[dkey(t)], yd = recs[dkey(new Date(t - 864e5))];
  if (yd && yd.in && !yd.out && t - new Date(yd.in.t) < 20 * 36e5) return { rec: yd, key: dkey(new Date(t - 864e5)), open: true };
  return { rec: td, key: dkey(t), open: !!(td && td.in && !td.out) };
}
function geoState(){
  if (SITE.lat == null) return { ok: false, cls: "bad", txt: "موقع المكان لسه متضبطش. كلم الإدارة." };
  if (!pos) return { ok: false, cls: "", txt: "جاري تحديد موقعك…" };
  const d = Math.round(dist(pos.latitude, pos.longitude, SITE.lat, SITE.lng));
  if (pos.accuracy > MAX_ACC) return { ok: false, cls: "warn", txt: "إشارة الـ GPS ضعيفة (±" + Math.round(pos.accuracy) + " م). اطلع مكان مفتوح وانتظر.", d };
  if (d > SITE.radius) return { ok: false, cls: "bad", txt: "أنت بعيد عن المكان بحوالي " + d + " متر. لازم تكون جوه نطاق " + SITE.radius + " متر.", d };
  return { ok: true, cls: "ok", txt: "أنت داخل نطاق المكان ✓ (" + d + " متر)", d };
}
function render(){
  if ($("vMain").classList.contains("hide")) return;
  const g = geoState(); setLoc(g.cls, g.txt);
  const c = current(), r = c.rec, b = $("punch");
  const done = r && r.in && r.out && !c.open;
  b.className = "punch" + (c.open ? " out" : "");
  b.textContent = done ? "تم تسجيل الحضور والانصراف ✓" : c.open ? "تسجيل انصراف" : "تسجيل حضور";
  b.disabled = !g.ok || done;
  $("tIn").textContent = r && r.in ? hm(r.in.t) : "--:--";
  $("tOut").textContent = r && r.out ? hm(r.out.t) : "--:--";
  const ms = r && r.in ? (r.out ? new Date(r.out.t) : new Date()) - new Date(r.in.t) : 0;
  $("tDur").textContent = r && r.in ? Math.floor(ms / 36e5) + ":" + pad(Math.floor(ms % 36e5 / 6e4)) : "--";
}
$("punch").onclick = async () => {
  const g = geoState(); if (!g.ok) return;
  const c = current(); $("punch").disabled = true; $("mErr").textContent = "";
  const pt = { t: new Date().toISOString(), ts: firebase.firestore.FieldValue.serverTimestamp(), lat: +pos.latitude.toFixed(6), lng: +pos.longitude.toFixed(6), acc: Math.round(pos.accuracy), dist: g.d };
  const ref = db.collection("punches").doc(me[0] + "_" + c.key);
  try{
    if (c.open){
      if (new Date() - new Date(c.rec.in.t) < 6e4){ $("mErr").textContent = "استنى دقيقة قبل الانصراف."; return; }
      await ref.set({ out: pt }, { merge: true });
      recs[c.key] = { ...c.rec, out: pt }; toast("تم تسجيل الانصراف ✓");
    } else {
      const base = { gid: me[0], code: me[2], name: me[1], dept: me[3], date: c.key, in: pt };
      await ref.set(base); recs[c.key] = base; toast("تم تسجيل الحضور ✓");
    }
  }catch(e){ $("mErr").textContent = "ماتسجلتش البصمة، اتأكد من النت وحاول تاني."; console.error(e); }
  finally{ render(); }
};
setInterval(() => { const n = new Date(); $("clock").textContent = pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds());
  $("date").textContent = n.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); render(); }, 1000);

/* دخول تلقائي لو الموظف سجل قبل كده على نفس الموبايل */
(() => { const g = localStorage.getItem("nc_me"); const r = g && ROSTER.find(x => String(x[0]) === g); if (r){ me = r; startMain(); } })();
</script>
